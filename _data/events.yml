- id: "outreach-sep"
  date: "2026-09-19"
  title: "Homeless outreach"
  where: "Downtown Bellingham"
  recap:
    facts:
      - label: "With"
        value: "Iglesia Pentecostal Nueva Jerusalén"
    text: |
      <p>It was not just a beautiful day, but it was also a blessing for us to be able to bless others. We can all do our part, no matter how big or small. Thank you for coming together to help us do what we do.</p>
      <p><strong>“It takes a village. When one of us hurts, we all hurt.”</strong></p>
    note: "Follow <a href=\"https://www.facebook.com/a.better.way.out\" rel=\"noopener noreferrer\" target=\"_blank\">our Facebook page</a> for the next one."
  photos:
