- id: "jam-river"
  date: "2026-06-26"
  title: "Jam on the River 2026 — live music &amp; family festival"
  where: "Centennial Riverwalk Park, 2007 Cherry St, Ferndale, WA 98248"
  recap:
    facts:
      - label: "When"
        value: "Fri June 26, 5:00–8:30 PM. Sat June 27, 12:00–8:30 PM"
      - label: "Cost"
        value: "Free"
    text: |
      <p><strong>Jam on the River</strong> returned to Ferndale’s Centennial Riverwalk Park on June 26–27, 2026. This free, all-ages festival brought the community together along the Nooksack River for a weekend of live music, food trucks, a beer garden, local vendors, and kids’ activities.</p>
      <p>A Better Way Out had a booth at the festival, sharing our programs and mission with families who stopped by to say hi.</p>
    note: "Follow <a href=\"https://www.facebook.com/a.better.way.out\" rel=\"noopener noreferrer\" target=\"_blank\">our Facebook page</a> for the next one."
  photos:
