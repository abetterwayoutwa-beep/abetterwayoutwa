- id: "gump-run"
  date: "2026-10-24"
  title: "2026 Gump Run 5K — Running for the Kids &amp; A Better Way Out"
  where: "Everson City Park, 201–205 Lincoln St, Everson, WA 98247"
  recap:
    facts:
      - label: "When"
        value: "Check-in 9:00 AM, 5K started 10:00 AM"
      - label: "Who"
        value: "Runners, walkers, and families of all ages"
    text: |
      <p>On a crisp fall Saturday, runners, walkers, families, and volunteers gathered at Everson City Park for the <strong>2026 Gump Run 5K</strong>, a fun run supporting the kids and the mission of <strong>A Better Way Out</strong>. The course followed the Nooksack River trail and back, with volunteers at every crossing to keep everyone safe.</p>
      <p>The park was full of Forrest Gump spirit, from “Life is like a box of chocolates” banners to boxes of chocolates waiting for the finishers alongside the medals. Our tent kept a fire going for anyone who needed to warm up before and after the run.</p>
      <p>Thank you to every runner, volunteer, and supporter who showed up. Every step helps us provide mentorship, support, and hope to young people in our community. <strong>Run. Support. Transform.</strong></p>
    note: "Follow <a href=\"https://www.facebook.com/a.better.way.out\" rel=\"noopener noreferrer\" target=\"_blank\">our Facebook page</a> for the next one."
  posters:
    - src: "images/FB_IMG_1786567376608.jpg"
      alt: "Flyer for the 2026 Gump Run 5K, Running for the Kids"
      width: 1009
      height: 1605
  photos:
    - src: "images/gump-run-2026-1.jpg"
      thumb: "images/thumbs/gump-run-2026-1.jpg"
      alt: "Yellow inflatable START arch on the grass at Everson City Park, lined with colorful pennant flags"
      width: 480
      height: 640
    - src: "images/gump-run-2026-2.jpg"
      thumb: "images/thumbs/gump-run-2026-2.jpg"
      alt: "Runners checking in at the gazebo table under a Life is like a box of chocolates banner"
      width: 480
      height: 640
    - src: "images/gump-run-2026-3.jpg"
      thumb: "images/thumbs/gump-run-2026-3.jpg"
      alt: "Two volunteers in Gump Run hats at the refreshment table with fruit, water, and snack bars"
      width: 480
      height: 640
    - src: "images/gump-run-2026-4.jpg"
      thumb: "images/thumbs/gump-run-2026-4.jpg"
      alt: "Medals and ribbon-tied boxes of chocolates laid out as prizes for finishers"
      width: 480
      height: 640
    - src: "images/gump-run-2026-5.jpg"
      thumb: "images/thumbs/gump-run-2026-5.jpg"
      alt: "Three runners wearing race bibs standing by a fire pit under the A Better Way Out tent"
      width: 480
