  where: "500 N. 14th St., Lynden, WA 98264"
  upcoming:
    facts:
      - label: "When"
        value: "5:00 – 7:00 PM"
      - label: "Food"
        value: "Pizza, snacks, and drinks"
      - label: "Contact"
        value: "Bernabe Garcia <a href=\"tel:+13605109300\">(360) 510-9300</a> or David Garcia <a href=\"tel:+13605404466\">(360) 540-4466</a>"
    text: |
      <p>Join us for an evening of real life testimonies impacting our young people for <strong>A Better Way Out</strong>. Come hear real stories from real people, and see how hope changes lives.</p>
