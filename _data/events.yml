# ============================================================================
#  ALL EVENTS LIVE HERE. Edit this one file; the site builds the rest:
#    - Homepage "Next event" banner  -> the soonest event dated today or later
#    - events.html "Upcoming"        -> every event dated today or later
#    - events-YEAR.html archive      -> every past event of that year, newest first
#  An event moves from Upcoming to the archive automatically after its date
#  (on the next push; visitors' browsers also hide it the day after).
#
#  Fields (order does not matter, list order does not matter):
#    id:        short unique name, used in links (events.html#id)
#    date:      "YYYY-MM-DD"  <- keep the quotes
#    title:     HTML allowed (&amp; for &)
#    where:     address line
#    upcoming:  shown before the event  -> facts (label/value), text (HTML), note
#    recap:     shown after the event   -> facts, text, note  (falls back to upcoming)
#    home:      optional short title/line for the homepage banner
#    posters:   flyers  -> src, alt, width, height
#    photos:    photos  -> src, thumb (optional small version), alt, width, height
#    photo_grid: true for an even 4-column grid (use when all photos are the same shape)
#    videos:    YouTube -> youtube (video id), title
#  For a new year, copy events-2026.html to events-2027.html and change `year:` and `title:`.
# ============================================================================

- id: "night-of-testimonies"
