- id: "outreach-may"
  date: "2026-05-16"
  title: "Homeless outreach"
  where: "Downtown Bellingham, Cornwall Alleys"
  recap:
    facts:
      - label: "When"
        value: "Met at 12:00 PM"
      - label: "Who"
        value: "Open to all volunteers"
    text: |
      <p>Our team and volunteers gathered to serve those experiencing homelessness in downtown Bellingham. Volunteers met at noon to prepare food together, then headed out to the Cornwall Alleys area to distribute meals and supplies directly to those in need.</p>
      <p>A huge thank you to everyone who showed up with a compassionate heart. Your time and presence made a real difference.</p>
    note: "Follow <a href=\"https://www.facebook.com/a.better.way.out\" rel=\"noopener noreferrer\" target=\"_blank\">our Facebook page</a> for the next one."
  photos:
    - src: "images/homless_outreach.jpg"
      alt: "Homeless outreach event flyer"
      width: 2048
      height: 946
      flyer: true

