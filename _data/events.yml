  title: "Q&amp;A with the Director"
  where: "Ferndale Public Library, 2125 Main St, Ferndale, WA 98248"
  recap:
    facts:
      - label: "When"
        value: "10:30 AM–12:30 PM"
      - label: "Who"
        value: "Ages 12+"
    text: |
      <p>A community Q&amp;A with the Director of <em>A Better Way Out</em>: a chance to learn about our mission, our programs, and how we support people in finding positive paths in life. Attendees asked questions about our mission, met the director and team, and learned how to get involved.</p>
      <p><strong>Who attended:</strong> youth ages 12 and up, community members, parents and mentors, city officials, nonprofits, and business leaders.</p>
    note: "Follow <a href=\"https://www.facebook.com/a.better.way.out\" rel=\"noopener noreferrer\" target=\"_blank\">our Facebook page</a> for the next one."
