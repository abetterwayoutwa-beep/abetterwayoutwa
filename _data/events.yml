- id: "safe-space"
  date: "2026-08-13"
  title: "Create a safe space — with Whatcom Dispute Resolution Center"
  where: "Ferndale Public Library, 2125 Main St, Ferndale, WA 98248"
  recap:
    facts:
      - label: "When"
        value: "2:00–3:00 PM"
      - label: "Who"
        value: "Young people ages 12+ and parents"
    text: |
      <p><strong>A Better Way Out</strong> and the <strong>Whatcom Dispute Resolution Center</strong> collaborated to create a safe space — <em>Support. Listen. Respect. Together.</em></p>
      <p><strong>Subject: stress and how to deal with it.</strong> Young people and parents learned healthy ways to manage stress, shared and listened in a safe space, built stronger relationships, and grew together as a community.</p>
      <p>You matter. Your voice matters. Our community matters. Stronger together — better together!</p>
    note: "Learn more about our partner at <a href=\"https://www.whatcomdrc.org\" rel=\"noopener noreferrer\" target=\"_blank\">whatcomdrc.org</a>."
  posters:
    - src: "images/ABWO-and-WDRC.jpg"
      alt: "Create a Safe Space event flyer from A Better Way Out and the Whatcom Dispute Resolution Center"
      width: 800
      height: 1200

- id: "amando"
  date: "2026-08-01"
  title: "Amando Mi Comunidad — Loving My Community"
  where: "4860 Northwest Dr, Bellingham, WA 98226"
  recap:
    facts:
      - label: "When"
        value: "12:00–3:30 PM"
      - label: "Cost"
        value: "Free, whole family welcome"
      - label: "Sponsor"
        value: "Whatcom Community Foundation"
    text: |
      <p><strong>Amando Mi Comunidad</strong> (Loving My Community) was a free, family-friendly community event held on Saturday, August 1. There was delicious food for everyone and fun activities for kids, while invited organizations shared information about resources, services, and support available for you and your community, including:</p>
      <ul>
      <li>Mental health counselors</li>
      <li>Food bank</li>
      <li>Home weatherization &amp; repair</li>
      <li>Education specialist</li>
      <li>Housing services &amp; support</li>
      <li>Health support</li>
      <li>And more</li>
      </ul>
      <p>Special thanks to sponsor <strong>Whatcom Community Foundation</strong> for supporting this event.</p>
    note: "Follow <a href=\"https://www.facebook.com/a.better.way.out\" rel=\"noopener noreferrer\" target=\"_blank\">our Facebook page</a> for the next one."
  posters:
    - src: "images/amando-mi-comunidad.jpg"
      alt: "Amando Mi Comunidad event flyer"
      width: 1131
      height: 1600
  videos:
    - youtube: "6qFkTRWGbhc"
      title: "Serving Our Community: Cornhole with Kids at Amando mi Comunidad"
    - youtube: "AKfDjFIjZ1g"
      title: "Cornhole Fun with Kids at Amando mi Comunidad — Part 2"
    - youtube: "GDKV666FdE0"
