name: Build, check, and deploy

# build ──► lighthouse (one job per page, in parallel) ──► deploy
#       └─► external-links (report only, never blocks)
#
# Pull requests run build + lighthouse + external-links but never deploy.
# Repo Settings -> Pages -> Source must be "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:          # check only, never deploys
  workflow_dispatch:     # "Run workflow" button in the Actions tab
  schedule:
    # Daily rebuild so finished events move to the archive on their own.
    # 09:23 UTC = just after 1-2 AM in Washington (Pacific time).
    - cron: "23 9 * * *"

permissions:
  contents: read

# One deploy at a time. PR runs get their own group so they never cancel a queued deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Responsive images: resized WebP copies + sizes for the templates (not committed)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore generated images
        uses: actions/cache@v4
        with:
          path: assets/img
          # exact match only: any image change regenerates everything (~10 s)
          key: images-${{ hashFiles('images/**', '_tools/images.py') }}
      - name: Generate responsive images
        run: |
          python -m pip install --quiet "pillow>=11,<12"
          python _tools/images.py

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Build timezone is Pacific
        run: |
          stamp=$(grep -o 'built [0-9-]* [0-9:]* [-+][0-9]*' _site/index.html | head -1)
          echo "$stamp"
          case "$stamp" in
            *-0700|*-0800) echo "Timezone OK" ;;
            *) echo "::error::Site was not built in Pacific time ($stamp); event dates would be off"; exit 1 ;;
          esac

      - name: GA tracking (shared.js on every page)
        shell: bash
        run: |
          missing=0
          while IFS= read -r f; do
            if ! grep -q 'shared\.js' "$f"; then
              echo "::error file=$f::Page does not load shared.js (GA tracking missing)"
              missing=1
            fi
          done < <(find _site -name '*.html' -not -name 'google*.html')
          [ "$missing" -eq 0 ] && echo "All pages load shared.js"
          exit $missing

      - name: Image size check (warn over 500 KB)
        shell: bash
        run: |
          found=0
          while IFS= read -r f; do
            echo "::warning file=${f#_site/}::Image is $(( $(stat -c%s "$f") / 1024 )) KB, consider compressing"
            found=1
          done < <(find _site -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' \) -size +500k)
          [ "$found" -eq 0 ] && echo "All images under 500 KB"
          exit 0

      - name: Internal links (blocks deploy if broken)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/_site" './_site/**/*.html'
          fail: true

      # The built site, for the lighthouse and external-links jobs
      - name: Share built site with later jobs
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 1

      # The built site, packaged for GitHub Pages (deployed only after lighthouse passes)
      - name: Package site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  # Each page is tested in its own job so they run side by side (3 runs each, median).
  # Thresholds live in .lighthouserc.json; any failure blocks deploy.
  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        page:
          - index.html
          - about.html
          - events.html
          - events-2026.html
          - events/2026/gump-run.html
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .lighthouserc.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Cache Lighthouse CI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: lhci-0.15.1
      - name: Lighthouse ${{ matrix.page }}
        run: npx --yes @lhci/cli@0.15.1 autorun --collect.url="http://localhost/${{ matrix.page }}"
      - name: Report name
        if: always()
        id: name
        run: echo "slug=$(echo '${{ matrix.page }}' | tr '/.' '--')" >> "$GITHUB_OUTPUT"
      - name: Save Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ steps.name.outputs.slug }}
          path: lhci-report
          if-no-files-found: ignore

  # Checks links to other websites. Report only: it never blocks deploy.
  external-links:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: External links (report only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --scheme https --scheme http
            --accept 200,204,206,301,302,403,429
            --max-retries 2
            --timeout 20
            --exclude 'googletagmanager\.com'
            --exclude 'google-analytics\.com'
            --exclude '^https://www\.abetterwayoutwa\.org'
            --root-dir "${{ github.workspace }}/_site"
            './_site/**/*.html'
          fail: false

  # One stable check name for branch protection ("All checks passed"),
  # so the rule doesn't have to list every Lighthouse page.
  checks:
    name: All checks passed
    if: always()
    needs: [build, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: |
          echo "build: ${{ needs.build.result }}, lighthouse: ${{ needs.lighthouse.result }}"
          [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.lighthouse.result }}" = "success" ]

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # With Actions deploys, the custom domain comes from Settings -> Pages -> Custom domain
      # (the CNAME file is not used). Fail loudly if the site is not on our domain.
      - name: Custom domain check
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Deployed to: $PAGE_URL"
          case "$PAGE_URL" in
            https://www.abetterwayoutwa.org*) echo "Custom domain OK" ;;
            *) echo "::error::Site deployed to '$PAGE_URL', not www.abetterwayoutwa.org. Check Settings -> Pages -> Custom domain."; exit 1 ;;
          esac
